<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>CMH Savar — Medical Section Directory</title>
<meta name="theme-color" content="#0a2540">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --navy-950:#08192e; --navy-900:#0a2540; --navy-800:#12335c; --navy-700:#1a4373;
    --steel:#2e6ea6; --gold:#c99a3d; --gold-soft:#e8b64a; --rose:#b8305a; --rose-soft:#d85f88;
    --ok:#1f7a4d; --wa:#1fae5c; --warn:#b8790c; --danger:#dc2626; --bg:#f2f4f7;
    --surface:#ffffff; --surface-2:#f7f8fa; --border:#e2e6ec; --text-1:#111826;
    --text-2:#4b5566; --text-3:#8992a3; --radius-lg:18px; --radius-md:12px;
    --shadow-sm:0 1px 2px rgba(10,37,64,.06); --shadow-md:0 6px 20px rgba(10,37,64,.10);
  }
  *{ margin:0; padding:0; box-sizing:border-box; font-family:'Inter',sans-serif; }
  body{ background:var(--bg); color:var(--text-1); min-height:100vh; }
  
  header{ background: linear-gradient(150deg, var(--navy-950), var(--navy-800) 65%, var(--navy-700)); color:#f4f7fb; padding:22px 16px; position:relative; box-shadow:0 6px 22px rgba(8,25,46,.35); display:flex; justify-content:space-between; align-items:center;}
  .eyebrow{ font-size:10.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--gold-soft); font-weight:700; opacity:.9; }
  h1{ font-size:17px; font-weight:800; line-height:1.25; }
  .header-actions button { background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.2); color:#fff; padding:8px 12px; border-radius:8px; font-size:13px; font-weight:bold; cursor:pointer; }
  
  .controls { background: var(--bg); padding:12px 16px; position:sticky; top:0; z-index:10; border-bottom:1px solid var(--border); }
  .controls-inner { max-width:720px; margin:0 auto; }
  .search-box { width:100%; padding:12px; border-radius:12px; border:1.5px solid var(--border); margin-bottom:10px; font-size:15px; outline:none; }
  .row-controls { display:flex; gap:8px; }
  .tab-buttons { display:flex; flex:1; background:var(--surface-2); padding:4px; border-radius:12px; border:1px solid var(--border); }
  .tab-buttons button { flex:1; padding:8px; border:none; background:transparent; border-radius:9px; font-weight:bold; cursor:pointer; color:var(--text-2); }
  .tab-buttons button.active { background:var(--navy-900); color:#fff; }
  
  main{ max-width:720px; margin:0 auto; padding:14px 16px 60px; }
  
  .contact-card{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-md); padding:14px; margin-bottom:10px; box-shadow:var(--shadow-sm); display:flex; flex-direction:column; gap:10px;}
  .card-top{ display:flex; align-items:flex-start; justify-content:space-between; }
  .rank-chip{ font-family:'JetBrains Mono',monospace; font-weight:800; font-size:12.5px; padding:6px 10px; border-radius:11px; color:#fff; background:linear-gradient(155deg, var(--steel), var(--navy-800)); }
  .contact-card.female .rank-chip{ background:linear-gradient(155deg, var(--rose-soft), var(--rose)); }
  .name{ font-size:16px; font-weight:700; color:var(--text-1); }
  .info-row{ font-size:13px; color:var(--text-2); display:flex; flex-wrap:wrap; gap:8px; margin-top:4px; line-height: 1.6;}
  .info-row b{ color:var(--text-1); }
  
  .btn-group{ display:flex; gap:8px; margin-top:8px; }
  .btn-group a{ flex:1; padding:10px; text-decoration:none; border-radius:9px; font-weight:700; font-size:13px; color:#fff; text-align:center; }
  .call-btn{ background:var(--ok); } .wa-btn{ background:var(--wa); }

  .admin-actions { display: none; gap: 8px; margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--border); }
  .admin-mode .admin-actions { display: flex; }
  .btn-edit { background: var(--steel); color: #fff; border:none; padding: 8px; border-radius: 8px; cursor:pointer; flex:1; font-weight:bold;}
  .btn-delete { background: var(--danger); color: #fff; border:none; padding: 8px; border-radius: 8px; cursor:pointer; flex:1; font-weight:bold;}
  
  #addBtn, #migrateBtn { display:none; width:100%; padding:14px; color:white; border:none; border-radius:12px; font-weight:bold; margin-bottom:16px; cursor:pointer; font-size:15px; }
  #addBtn { background:var(--navy-900); }
  #migrateBtn { background:var(--warn); margin-bottom: 20px;}
  .admin-mode #addBtn { display:block; }
  
  .modal-overlay { display:none; position:fixed; inset:0; background:rgba(8,25,46,.7); backdrop-filter:blur(4px); justify-content:center; align-items:center; z-index:999; padding:16px;}
  .modal-overlay.open { display:flex; }
  .modal-box { background:var(--surface); padding:20px; border-radius:var(--radius-lg); width:100%; max-width:380px; box-shadow:var(--shadow-lg); }
  .form-group { margin-bottom:12px; }
  .form-group label { display:block; font-size:13px; font-weight:bold; margin-bottom:6px; color:var(--text-2);}
  .form-group input, .form-group select { width:100%; padding:10px; border:1px solid var(--border); border-radius:8px; font-size:14px; outline:none;}
  .form-group input:focus { border-color:var(--steel); }
  .modal-buttons { display:flex; gap:10px; margin-top:20px; }
  .modal-buttons button { flex:1; padding:12px; border:none; border-radius:10px; font-weight:bold; cursor:pointer; font-size:14px;}
</style>
</head>
<body>

<header>
  <div>
    <div class="eyebrow">Bangladesh Army · CMH Savar</div>
    <h1>Medical Section Directory</h1>
  </div>
  <div class="header-actions">
    <button id="loginBtn">Admin</button>
    <button id="logoutBtn" style="display:none; background:var(--danger); border:none;">Logout</button>
  </div>
</header>

<div class="controls">
  <div class="controls-inner">
    <input type="text" id="searchInput" class="search-box" placeholder="Search by name, rank or army no..." autocomplete="off">
    <div class="row-controls">
      <div class="tab-buttons" id="genderTabs">
        <button class="active" data-val="all">All</button>
        <button data-val="male">Male</button>
        <button data-val="female">Female</button>
      </div>
    </div>
  </div>
</div>

<main id="mainContainer">
  <button id="migrateBtn">⚠️ Migrate Old Data to Firebase (Click Once)</button>
  <button id="addBtn">+ Add New Personnel</button>
  
  <div id="loading" style="text-align:center; padding:30px; font-weight:bold; color:var(--text-3);">Fetching Secure Data...</div>
  <div id="list"></div>
</main>

<!-- Login Modal -->
<div id="loginModal" class="modal-overlay">
  <div class="modal-box">
    <h3 style="margin-bottom: 15px;">Admin Login</h3>
    <div class="form-group"><label>Email</label><input type="email" id="adminEmail"></div>
    <div class="form-group"><label>Password</label><input type="password" id="adminPass"></div>
    <div class="modal-buttons">
      <button style="background:var(--surface-2); color:var(--text-2); border:1px solid var(--border);" onclick="closeModal('loginModal')">Cancel</button>
      <button style="background:var(--steel); color:#fff;" id="doLogin">Login</button>
    </div>
  </div>
</div>

<!-- Add/Edit Modal -->
<div id="dataModal" class="modal-overlay">
  <div class="modal-box">
    <h3 id="modalTitle" style="margin-bottom: 15px;">Personnel Data</h3>
    <input type="hidden" id="editId">
    <div class="form-group"><label>Army No</label><input type="text" id="m_army" placeholder="e.g. BJO-73300"></div>
    <div class="form-group"><label>Rank</label><input type="text" id="m_rank" placeholder="e.g. SGT"></div>
    <div class="form-group"><label>Name</label><input type="text" id="m_name"></div>
    <div class="form-group"><label>Phone</label><input type="text" id="m_phone"></div>
    <div class="form-group"><label>Remarks / Duty</label><input type="text" id="m_remarks"></div>
    <div class="form-group">
      <label>Gender</label>
      <select id="m_gender"><option value="male">Male</option><option value="female">Female</option></select>
    </div>
    <div class="modal-buttons">
      <button style="background:var(--surface-2); color:var(--text-2); border:1px solid var(--border);" onclick="closeModal('dataModal')">Cancel</button>
      <button style="background:var(--ok); color:#fff;" id="saveDataBtn">Save Changes</button>
    </div>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
  import { getFirestore, collection, onSnapshot, addDoc, doc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";
  import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";

  // ⚠️⚠️⚠️ নিচে আপনার ফায়ারবেস কনসোল থেকে কপি করা আসল Web Config বসান ⚠️⚠️⚠️
  const firebaseConfig = {
  apiKey: "AIzaSyBfc7WWaNkCHragcaxxbVjZDAT8wXtjOPY",
  authDomain: "cmh-savar-directory.firebaseapp.com",
  projectId: "cmh-savar-directory",
  storageBucket: "cmh-savar-directory.firebasestorage.app",
  messagingSenderId: "23640599257",
  appId: "1:23640599257:web:c9abc5f3e12bfe7c3dacc8"
};

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const auth = getAuth(app);
  const directoryRef = collection(db, "personnel");

  let fetchedData = [];
  let currentFilter = 'all';

  onSnapshot(directoryRef, (snapshot) => {
    fetchedData = [];
    snapshot.forEach((doc) => {
      fetchedData.push({ id: doc.id, ...doc.data() });
    });
    
    document.getElementById('loading').style.display = 'none';
    
    if(fetchedData.length === 0 && auth.currentUser) {
      document.getElementById('migrateBtn').style.display = 'block';
    } else {
      document.getElementById('migrateBtn').style.display = 'none';
    }

    renderUI();
  });

  function renderUI() {
    const listEl = document.getElementById('list');
    listEl.innerHTML = '';
    const searchTerm = document.getElementById('searchInput').value.toLowerCase();

    const filteredData = fetchedData.filter(item => {
      const matchSearch = (item.name && item.name.toLowerCase().includes(searchTerm)) || 
                          (item.army && item.army.toLowerCase().includes(searchTerm)) ||
                          (item.rank && item.rank.toLowerCase().includes(searchTerm)) ||
                          (item.phone && item.phone.includes(searchTerm));
      const matchGender = currentFilter === 'all' || item.gender === currentFilter;
      return matchSearch && matchGender;
    });

    if(filteredData.length === 0) {
      listEl.innerHTML = `<div style="text-align:center; padding:40px; color:var(--text-3);">No data found.</div>`;
      return;
    }

    // Rank sorting order
    const rankOrder = ["SWO", "WO", "SGT", "CPL", "LCPL", "SNK", "SNK PMA"];
    filteredData.sort((a, b) => {
      let rankA = rankOrder.indexOf(a.rank);
      let rankB = rankOrder.indexOf(b.rank);
      if (rankA === -1) rankA = 99;
      if (rankB === -1) rankB = 99;
      return rankA - rankB;
    });

    filteredData.forEach(item => {
      const isFemale = item.gender === 'female';
      listEl.innerHTML += `
        <div class="contact-card ${isFemale ? 'female' : ''}">
          <div class="card-top">
            <span class="rank-chip">${item.rank || ''}</span>
            <div style="text-align:right;">
              <div class="name">${item.name || ''}</div>
              <div style="font-size:12px; color:var(--text-3);">${item.army || ''}</div>
            </div>
          </div>
          
          <div class="info-row">
            <div style="flex:1;">Phone: <b>${item.phone || ''}</b></div>
            ${item.remarks ? `<div>Duty: <b>${item.remarks}</b></div>` : ''}
          </div>

          <div class="btn-group">
            <a href="tel:${item.phone}" class="call-btn">Call</a>
            <a href="https://wa.me/88${item.phone}" target="_blank" class="wa-btn">WhatsApp</a>
          </div>

          <div class="admin-actions">
            <button class="btn-edit" onclick="openEdit('${item.id}')">Edit</button>
            <button class="btn-delete" onclick="deleteData('${item.id}')">Delete</button>
          </div>
        </div>
      `;
    });
  }

  document.getElementById('searchInput').addEventListener('input', renderUI);
  document.getElementById('genderTabs').addEventListener('click', (e) => {
    if(e.target.tagName === 'BUTTON') {
      document.querySelectorAll('#genderTabs button').forEach(b => b.classList.remove('active'));
      e.target.classList.add('active');
      currentFilter = e.target.getAttribute('data-val');
      renderUI();
    }
  });

  onAuthStateChanged(auth, (user) => {
    if (user) {
      document.getElementById('mainContainer').classList.add('admin-mode');
      document.getElementById('loginBtn').style.display = 'none';
      document.getElementById('logoutBtn').style.display = 'block';
      if(fetchedData.length === 0) document.getElementById('migrateBtn').style.display = 'block';
    } else {
      document.getElementById('mainContainer').classList.remove('admin-mode');
      document.getElementById('loginBtn').style.display = 'block';
      document.getElementById('logoutBtn').style.display = 'none';
      document.getElementById('migrateBtn').style.display = 'none';
    }
  });

  document.getElementById('loginBtn').onclick = () => document.getElementById('loginModal').classList.add('open');
  document.getElementById('logoutBtn').onclick = () => signOut(auth);
  
  document.getElementById('doLogin').onclick = () => {
    const email = document.getElementById('adminEmail').value;
    const pass = document.getElementById('adminPass').value;
    document.getElementById('doLogin').innerText = 'Verifying...';
    signInWithEmailAndPassword(auth, email, pass)
      .then(() => { 
        window.closeModal('loginModal'); 
        document.getElementById('adminEmail').value = '';
        document.getElementById('adminPass').value = '';
      })
      .catch(err => alert("Login Failed! Please check email/password."))
      .finally(() => document.getElementById('doLogin').innerText = 'Login');
  };

  document.getElementById('addBtn').onclick = () => {
    document.getElementById('editId').value = '';
    document.getElementById('modalTitle').innerText = 'Add New Personnel';
    ['m_army', 'm_rank', 'm_name', 'm_phone', 'm_remarks'].forEach(id => document.getElementById(id).value = '');
    document.getElementById('m_gender').value = 'male';
    document.getElementById('dataModal').classList.add('open');
  };

  window.openEdit = function(id) {
    const item = fetchedData.find(d => d.id === id);
    if(!item) return;
    document.getElementById('modalTitle').innerText = 'Edit Personnel';
    document.getElementById('editId').value = id;
    document.getElementById('m_army').value = item.army || '';
    document.getElementById('m_rank').value = item.rank || '';
    document.getElementById('m_name').value = item.name || '';
    document.getElementById('m_phone').value = item.phone || '';
    document.getElementById('m_remarks').value = item.remarks || '';
    document.getElementById('m_gender').value = item.gender || 'male';
    document.getElementById('dataModal').classList.add('open');
  };

  document.getElementById('saveDataBtn').onclick = async () => {
    const id = document.getElementById('editId').value;
    const payload = {
      army: document.getElementById('m_army').value.trim(),
      rank: document.getElementById('m_rank').value.trim(),
      name: document.getElementById('m_name').value.trim(),
      phone: document.getElementById('m_phone').value.trim(),
      remarks: document.getElementById('m_remarks').value.trim(),
      gender: document.getElementById('m_gender').value
    };

    if(!payload.name || !payload.phone) return alert("Name and Phone Number are required.");

    try {
      document.getElementById('saveDataBtn').innerText = "Saving...";
      if(id) {
        await updateDoc(doc(db, "personnel", id), payload);
      } else {
        await addDoc(directoryRef, payload);
      }
      window.closeModal('dataModal');
    } catch(e) {
      alert("Permission Denied: You must be an admin.");
    } finally {
      document.getElementById('saveDataBtn').innerText = "Save Changes";
    }
  };

  window.deleteData = async function(id) {
    if(confirm("Are you sure you want to permanently delete this record?")) {
      await deleteDoc(doc(db, "personnel", id));
    }
  };

  window.closeModal = function(modalId) {
    document.getElementById(modalId).classList.remove('open');
  };
